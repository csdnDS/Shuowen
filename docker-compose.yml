services:
  mongo:
    image: mongo:7
    container_name: shuowen-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - shuowen_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: shuowen-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: shuowen_dev
      MYSQL_DATABASE: shuowen
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - shuowen_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pshuowen_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  shuowen_mongo_data:
  shuowen_mysql_data:
